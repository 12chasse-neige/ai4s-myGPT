model:
  block_size: 256
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.1
  bias: false

data:
  path: outputs/data/tinystories.txt
  train_fraction: 0.9
  batch_size: 16
  num_workers: 0

tokenizer:
  type: bpe
  path: outputs/tokenizers/tinystories-10k.json
  vocab_size: 10000
  min_frequency: 2

training:
  seed: 42
  max_steps: 5000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 20
  log_interval: 10
  output_dir: outputs/gpt-medium-bpe
  device: auto
