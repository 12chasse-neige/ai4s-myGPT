model:
  block_size: 1024
  n_layer: 12
  n_head: 10
  n_embd: 640
  dropout: 0.1
  bias: false

data:
  path: outputs/data/tinystories.txt
  train_fraction: 0.95
  batch_size: 4
  num_workers: 0

training:
  seed: 42
  max_steps: 80000
  learning_rate: 0.0002
  min_learning_rate: 0.00002
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 1000
  eval_batches: 100
  log_interval: 20
  output_dir: outputs/gpt-pretrain
  device: auto